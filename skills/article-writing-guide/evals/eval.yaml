schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  model:
    provider: anthropic
    name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/review-report.yaml
    - evals/cases/english-tutorial.yaml
    - evals/cases/deleted-skill.yaml
    - evals/cases/tutorial-series.yaml
    - evals/cases/self-tutorial.yaml
    - evals/cases/de-ai.yaml
    - evals/cases/frontend-transfer.yaml
    - evals/cases/out-of-domain.yaml
  defaults:
    timeout_seconds: 240
    max_turns: 10
  parallelism: 3

judge:
  type: rule_based

report:
  formats: [json, html]
  artifacts:
    - transcript
