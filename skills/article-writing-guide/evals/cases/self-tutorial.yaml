id: self-tutorial
title: 教程裁决-给自己学会
description: 给自己学会的教程 → 转介 learning-guide，不留在写作域。
tag: routing
input:
  prompt: |
    请用 article-writing-guide 做开工路由判断：输出「分类 / 主路径 / 组合 / 闸门 / 下一步」五项路由契约，只做路由判断，不要执行任务本身。
    请求：我想给自己做一套学习 Java 的教程，边做边学
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["learning-guide"]
