schema_version: "1.0"
name: research-no-route
description: 学习调研类问题不适用 coding-workflow，应直接回答或转介，不套代码改动流程。
tags: [behavior]
execution:
  prompt: |
    请用 coding-workflow 做开工路由判断：以下请求是否适用于本 skill？只做判断，不执行任何改动。最后用一句完整的自然语言下结论，结论中必须包含「不用于」三字。
    请求：解释一下 Redis 缓存穿透和缓存雪崩的区别，以及常见应对手段。
  max_turns: 10
  model: claude-haiku-4-5
  allowed_tools: []
runs: 1
graders:
  - type: regex
    name: says-not-for-this
    target: last_message
    pattern: '不(?:适)?用于'
    match: contains
  - type: regex
    name: names-research-category
    target: last_message
    pattern: '学习调研|纯问答|概念|知识|解释'
    match: contains
