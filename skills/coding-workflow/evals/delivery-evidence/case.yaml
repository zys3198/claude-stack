schema_version: "1.0"
name: delivery-evidence
description: 完成小改动后，交付回执必须包含改动范围、验证证据、未完成项/风险。
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    用 coding-workflow 处理：src/discount.py 新用户折扣写成了 0.2，应为 0.8。直接用 Edit 修改，不要派 Agent 子代理；仓库没有测试框架。改完按 §1.3 给出交付回执，必须含「改动范围」「验证证据」「未完成项/风险」这三个字段名。
  max_turns: 10
  model: claude-haiku-4-5
  allowed_tools: [Read, Edit]
runs: 1
graders:
  - type: regex
    name: receipt-scope
    target: last_message
    pattern: 改动范围
    match: contains
  - type: regex
    name: receipt-evidence
    target: last_message
    pattern: 验证证据
    match: contains
  - type: regex
    name: receipt-risk
    target: last_message
    pattern: 风险
    match: contains
