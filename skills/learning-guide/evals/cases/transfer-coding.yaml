id: transfer-coding
title: 兄弟域转介-写代码
description: 写代码任务不命中学习域 → 转介 ai-coding-guide。
tag: routing
input:
  prompt: |
    请用 learning-guide 做开工路由判断：输出「分类 / 主路径 / 组合 / 闸门 / 下一步」五项路由契约，只做路由判断，不要执行任务本身。
    请求：帮我写个 Python 脚本处理 CSV
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["ai-coding-guide"]
