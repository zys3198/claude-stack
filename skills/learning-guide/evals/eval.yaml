schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  model:
    provider: anthropic
    name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/deep-learn.yaml
    - evals/cases/cram-engine.yaml
    - evals/cases/sentiment.yaml
    - evals/cases/transfer-coding.yaml
    - evals/cases/transfer-article.yaml
    - evals/cases/self-tutorial.yaml
  defaults:
    timeout_seconds: 240
    max_turns: 10
  parallelism: 3

judge:
  type: rule_based

report:
  formats: [json, html]
  artifacts:
    - transcript
