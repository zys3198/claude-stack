schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  model:
    provider: anthropic
    name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/create-context.yaml
  defaults:
    timeout_seconds: 240
    max_turns: 8
  parallelism: 1

judge:
  type: rule_based

report:
  formats: [json, html]
  artifacts:
    - transcript
