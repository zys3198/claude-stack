schema_version: "1.0"
name: route-single-audit
description: 单个 Skill 的触发、运行和组合审计应转交 skill-auditor-by-user，不应启动库级留删判定。
tags: [negative, routing]
execution:
  prompt: |
    我只想审查一个现有 Skill 的 description、触发边界、运行行为和组合交接。
    不要评估整个 Skill 库的保留、归档或删除。请判断 skill-trimmer-by-user 是否负责，并给出正确转介路径。
  max_turns: 8
  model: claude-haiku-4-5
  allowed_tools: []
runs: 1
graders:
  - type: regex
    name: delegate-auditor
    target: last_message
    pattern: skill-auditor-by-user
    match: contains
  - type: regex
    name: trim-boundary
    target: last_message
    pattern: 不负责
    match: contains
