id: audit-router
title: 命中-审查 router guide 路由质量
description: 目标=router 型 guide → 命中，跑十查 + 动态基线，按本 skill 输出格式给 P0-P2 清单。
tag: routing
input:
  prompt: |
    请用 guide-skill-auditor 做开工路由判断：是否命中本 skill？命中则给出将执行的检查框架（十查/基线），不命中则给出转介路径。只做判断，不要执行审计本身。
    请求：帮我审查一下 ai-coding-guide 现在的路由质量
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["十查"]
