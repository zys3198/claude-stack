id: sibling-grab
title: 命中-兄弟域抢单排查
description: 兄弟域抢单/误路由 → 命中，动态基线必跑（撞词场景），误路由记 P0。
tag: routing
input:
  prompt: |
    请用 guide-skill-auditor 做开工路由判断：是否命中本 skill？命中则给出将执行的检查框架（十查/基线），不命中则给出转介路径。只做判断，不要执行审计本身。
    请求：article-writing-guide 老是被 ai-coding-guide 抢单，帮我排查
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["基线"]
