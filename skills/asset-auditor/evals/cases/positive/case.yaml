schema_version: "1.0"
name: retain-candidate
description: 对低风险候选先做存在性门禁，再决定保留、分流或待验证，不修改文件。
tags: [positive, lifecycle]
execution:
  prompt: |
    /asset-auditor

    请使用 asset-auditor 评估一个低风险候选 Skill 是否值得作为独立 Skill 存在。
    候选：一个只包含通用“先读项目、再写代码、最后跑测试”提醒的流程 Skill。
    只输出本轮范围与停止点、存在性结论、静态证据、运行证据缺口和建议动作；不要修改、移动或删除任何文件。
  max_turns: 8
  model: claude-haiku-4-5
  allowed_tools: []
runs: 1
graders:
  - type: regex
    name: existence-contract
    target: last_message
    pattern: 存在性
    match: contains
  - type: regex
    name: scope-stop
    target: last_message
    pattern: 范围与停止点
    match: contains
  - type: regex
    name: runtime-evidence
    target: last_message
    pattern: 运行证据
    match: contains
