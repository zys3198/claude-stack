schema_version: "1.0"
name: missing-acceptance
description: 目标和验收标准缺失时先问反向问题补齐上下文，不直接开写。
tags: [behavior]
execution:
  prompt: |
    用 code-change-workflow 处理：把用户登录接口优化一下，体验要好，尽快弄。按 §1.1 的 Context→追问→执行环，先提 1-3 个反向问题，其中必须包含验收标准相关问题，并复述你对需求的理解请用户确认。
  max_turns: 10
  model: claude-haiku-4-5
  allowed_tools: []
runs: 1
graders:
  - type: regex
    name: asks-acceptance-criteria
    target: last_message
    pattern: 验收
    match: contains
  - type: regex
    name: confirms-understanding
    target: last_message
    pattern: 确认
    match: contains
