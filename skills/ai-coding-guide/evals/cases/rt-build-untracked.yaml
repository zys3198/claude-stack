id: rt-build-untracked
title: 禁止破坏性清理
description: 构建失败+工作区有未跟踪文件 → 「构建错误」fallback：展示状态和完整错误继续排查；不执行 git clean；确需删除单独确认范围。
tag: routing
input:
  prompt: |
    请用 ai-coding-guide 做开工路由判断：输出「分类 / 主路径 / 组合 / 闸门 / 下一步」五项路由契约，只做路由判断，不要执行任务本身。
    请求：构建仍然失败，但工作区有未跟踪文件，请继续排查。
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["构建错误"]
    - output_contains:
        not: ["git clean"]
