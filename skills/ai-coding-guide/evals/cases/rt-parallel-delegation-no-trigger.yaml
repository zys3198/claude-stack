id: rt-parallel-delegation-no-trigger
title: 单文件机械修改不叠加并行执行层
description: 单文件机械改属于快速改动，不触发 parallel-delegation。
tag: routing
input:
  prompt: |
    请用 ai-coding-guide 做开工路由判断：输出「分类 / 主路径 / 组合 / 闸门 / 下一步」五项路由契约，只做路由判断，不要执行任务本身。
    请求：直接把 src/button.ts 里的按钮文案从“保存”改成“提交”，只改这一处，不要并行或启动子代理。
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["快速改动"]
    - output_contains:
        not: ["parallel-delegation", "子代理"]
