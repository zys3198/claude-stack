id: rt-output-contract
title: 路由输出契约六项
description: 用户要结论别长篇 → 按输出契约返回：分类/主路径/组合/参与度/闸门/下一步，只补一句关键理由。
tag: routing
input:
  prompt: |
    请用 ai-coding-guide 做开工路由判断，只做路由判断，不要执行任务本身。
    请求：帮我判断这个需求该用什么 skill，直接给结论别长篇解释。
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["分类", "主路径", "闸门", "下一步"]
