id: rt-parallel-delegation
title: 独立子任务叠加并行执行层
description: 两个以上互不依赖且可单独验收的子任务 → 保留主分类并叠加 parallel-delegation；不替代主路径。
tag: routing
input:
  prompt: |
    请用 ai-coding-guide 做开工路由判断：输出「分类 / 主路径 / 组合 / 闸门 / 下一步」五项路由契约，只做路由判断，不要执行任务本身。
    请求：我要给现有服务增加三个互不依赖的工作项：补 API 文档、补单元测试、更新 CI 检查。三个工作项可以分别验收，怎么安排？
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["parallel-delegation", "主路径", "组合"]
