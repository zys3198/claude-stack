id: rt-prd-ready
title: 已有需求文档走有需求文档分类
description: PRD 已写好 → 「有需求文档」：手动拆 4-6 切片 + PLAN.md 确认后实现；只想整理需求项才 to-prd/to-issues。
tag: routing
input:
  prompt: |
    请用 ai-coding-guide 做开工路由判断：输出「分类 / 主路径 / 组合 / 闸门 / 下一步」五项路由契约，只做路由判断，不要执行任务本身。
    请求：PRD 已经写好了，下一步怎么落地？
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["有需求文档"]
