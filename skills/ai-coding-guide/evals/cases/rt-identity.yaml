id: rt-identity
title: 定位校准开工路由为主
description: 问定位 → 开工路由器是主目标；生态地图/质量闸门/学习陪跑服务路由，不写成工具大全/执行流水线/学习课程。
tag: routing
input:
  prompt: |
    请用 ai-coding-guide 做开工路由判断：输出「分类 / 主路径 / 组合 / 闸门 / 下一步」五项路由契约，只做路由判断，不要执行任务本身。
    请求：我想让 ai-coding-guide 同时承担开工路由、生态地图、质量闸门、学习陪跑，怎么定位才不乱？
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["开工路由"]
