id: rt-maint-new-skill
title: 新装 skill 触发维护场景
description: 刚装新 skill → 路由维护场景：先查当前会话和 ~/.claude 目录判断是否影响现有路由；只有影响才同步路由文件与 evals，不默认重写整个路由。
tag: routing
input:
  prompt: |
    请用 ai-coding-guide 做开工路由判断：输出「分类 / 主路径 / 组合 / 闸门 / 下一步」五项路由契约，只做路由判断，不要执行任务本身。
    请求：刚装了个新 skill，这个 ai-coding-guide 也要改吗？
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["路由指南维护"]
