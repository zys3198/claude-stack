schema_version: "1.0"
name: record-trace
description: 用户明确要求记录 Trace 时，应进入 record 路径，说明必需输入和可观察产物，不进入 propose 或 apply。
tags: [positive, routing, evidence]
execution:
  prompt: |
    我明确要使用 improver-skill 记录一次已有执行 Trace。
    现在只判断正确路径并列出 record 所需输入、完成证据和停止条件；不要运行命令、修改文件、提出候选或 apply。
  max_turns: 8
  model: claude-haiku-4-5
  allowed_tools: []
runs: 1
graders:
  - type: regex
    name: record-route
    target: last_message
    pattern: record
    match: contains
  - type: regex
    name: trace-output
    target: last_message
    pattern: Trace
    match: contains
  - type: regex
    name: no-apply
    target: last_message
    pattern: apply|不.*应用|不.*修改
    match: contains
