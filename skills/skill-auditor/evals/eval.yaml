schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  model:
    provider: anthropic
    name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/audit-router.yaml
    - evals/cases/sibling-grab.yaml
    - evals/cases/not-hit-polish.yaml
    - evals/cases/not-hit-selection.yaml
    - evals/cases/category-word.yaml
  defaults:
    timeout_seconds: 240
    max_turns: 10
  parallelism: 3

judge:
  type: rule_based

report:
  formats: [json, html]
  artifacts:
    - transcript
