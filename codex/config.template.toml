# Codex config.toml 模板 -- 可迁移片段（变量需回填，见 SETUP.md + setup.ps1）
# 不含：notify、[marketplaces.*]、[projects.*]、runtime hash 路径、[hooks.state]、cloudcli-browser（含真实 token）
# 这些由 Codex app 自动生成 / 本机特定 / 需公司电脑重新获取

model_provider = "custom"
model = "kimi-k3"
model_reasoning_effort = "high"
disable_response_storage = true
model_catalog_json = "cc-switch-model-catalog.json"
sandbox_mode = "danger-full-access"
approval_policy = "never"
personality = "pragmatic"

[model_providers.custom]
name = "custom"
wire_api = "responses"
requires_openai_auth = true
base_url = "{{PROXY_BASE_URL}}"               # 本机 http://127.0.0.1:15721/v1（cc-switch 代理）
experimental_bearer_token = "PROXY_MANAGED"   # 模板变量，cc-switch 代理注入真值，别手填

[features]
hooks = true
js_repl = false
memories = true

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true

# ----- plugins（enabled 配置可迁移；marketplace 源由 Codex app 自管）-----
[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = false  # 你写代码+markdown 不写 Office 文档

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false  # ppt-master skill 覆盖幻灯片

[plugins."open-code-review@open-code-review"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

# ----- MCP servers（路径变量化；node_repl 由 Codex app 自带，不进模板）-----
[mcp_servers.b2c3d4e5-playwright-mcp-002]
type = "stdio"
command = "cmd"
args = ["/c", "npx", "@playwright/mcp@latest"]

[mcp_servers.a1b2c3d4-context7-mcp-001]
type = "stdio"
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp"]

[mcp_servers.code-spec-plugin]
type = "stdio"
command = "npx"
args = ["tsx", "{{CODE_SPEC_PLUGIN_PATH}}", "mcp"]   # 本机 C:\ZYS\Code\Code-Spec-Plugin\src\cli.ts；公司电脑没此项目则删此段

[mcp_servers.c3d4e5f6-github-mcp-003]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"

[mcp_servers.douyin]
type = "stdio"
command = "{{PIPX_VENV_PYTHON}}"              # 本机 C:/Users/zys31/pipx/venvs/douyin-mcp-server/Scripts/python.exe
args = ["-m", "douyin_mcp_server"]

# cloudcli-browser 含真实 CLOUDCLI_BROWSER_USE_MCP_TOKEN，不进模板；公司电脑需要时重新获取 token 手动加

[windows]
sandbox = "elevated"

[desktop]
localeOverride = "zh-CN"
show-context-window-usage = true
keepRemoteControlAwakeWhilePluggedIn = true
selected-avatar-id = "custom:miku-kimono"
followUpQueueMode = "queue"

[env]
OPENAI_BASE_URL = "{{OPENAI_BASE_URL}}"        # 本机 http://127.0.0.1:4444/v1

# [shell_environment_policy.set] 含 runtime hash 与本机路径，公司电脑由 Codex app 重建；不进模板
