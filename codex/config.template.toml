# Codex config.toml 模板 -- 可迁移的非 provider 片段（公司电脑不用 cc-switch，provider/model/auth 自配）
# 公司电脑 Codex app 登录或在 config.toml 自配 provider/model/auth；本模板只提供用户偏好 + plugins + MCP 片段
# 不含：provider/model/auth、notify、[marketplaces.*]、[projects.*]、runtime hash 路径、[hooks.state]、cloudcli-browser（含真实 token）

sandbox_mode = "danger-full-access"
approval_policy = "never"
personality = "pragmatic"

[features]
hooks = true
js_repl = false
memories = true

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true

# ----- plugins（enabled 配置可迁移；marketplace 源由 Codex app 自管）-----
[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."open-code-review@open-code-review"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

# ----- MCP servers（路径变量化；node_repl 由 Codex app 自带，不进模板）-----
[mcp_servers.b2c3d4e5-playwright-mcp-002]
type = "stdio"
command = "cmd"
args = ["/c", "npx", "@playwright/mcp@latest"]

[mcp_servers.a1b2c3d4-context7-mcp-001]
type = "stdio"
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp"]

[mcp_servers.code-spec-plugin]
type = "stdio"
command = "npx"
args = ["tsx", "{{CODE_SPEC_PLUGIN_PATH}}", "mcp"]   # 公司电脑没此项目则删此段

[mcp_servers.c3d4e5f6-github-mcp-003]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"

[mcp_servers.douyin]
type = "stdio"
command = "{{PIPX_VENV_PYTHON}}"
args = ["-m", "douyin_mcp_server"]

# cloudcli-browser 含真实 token，不进模板；公司电脑需要时重新获取手动加

[windows]
sandbox = "elevated"

[desktop]
localeOverride = "zh-CN"
show-context-window-usage = true
keepRemoteControlAwakeWhilePluggedIn = true
selected-avatar-id = "custom:miku-kimono"
followUpQueueMode = "queue"
